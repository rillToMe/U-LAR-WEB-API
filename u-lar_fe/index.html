<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101216" />
    <title>u-lar_fe</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var root = document.documentElement;

        var inWebViewPage =
          path.indexOf("/ujian") === 0 ||
          path === "/materi" ||
          path.indexOf("/materi/") === 0;

        if (inWebViewPage) {
          var viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) {
            viewport.setAttribute(
              "content",
              "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
            );
          }

          document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
          });
        }

        if (inWebViewPage) {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
          root.style.backgroundColor = "#f9fafb";
        }

        if (path.indexOf("/ujian") === 0) {
          root.classList.add("exam-fit");

          return;
        }

        var stored = localStorage.getItem("u-lar-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#101216" : "#f9fafb";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101216" />
    <title>u-lar_fe</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var root = document.documentElement;

        // WebView game (Android) memakai setUseWideViewPort +
        // setLoadWithOverviewMode, sehingga tanpa viewport "tanpa zoom"
        // seluruh halaman bisa diperkecil agar muat. Kunci ke lebar perangkat
        // untuk halaman yang dirender di WebView: ujian dan materi.
        //
        // "/materi" dicek persis, sisanya memakai batas "/", supaya path
        // seperti "/materialnya" tidak ikut tertangkap.
        var inWebViewPage =
          path.indexOf("/ujian") === 0 ||
          path === "/materi" ||
          path.indexOf("/materi/") === 0;

        if (inWebViewPage) {
          var viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) {
            viewport.setAttribute(
              "content",
              "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
            );
          }

          // Menutup menu konteks browser supaya halaman tidak bisa diambil
          // lewat "View Source" atau "Save as" dari sana. Desktop memicunya
          // dengan klik kanan, HP dengan tekan-tahan - keduanya menghasilkan
          // event contextmenu yang sama, jadi satu blokir menutup dua-duanya.
          // Sengaja dibiarkan senyap tanpa pesan apa pun.
          document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
          });
        }

        // Web ujian (/ujian) dan halaman materi (/materi) selalu light mode -
        // tidak ada varian dark. Web admin tetap mengikuti tema tersimpan.
        if (inWebViewPage) {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
          root.style.backgroundColor = "#f9fafb";

          return;
        }

        var stored = localStorage.getItem("u-lar-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#101216" : "#f9fafb";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

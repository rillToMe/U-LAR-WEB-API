<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logo.webp" />
    <!-- Tanpa zoom: halaman ini dirender di WebView game, bukan browser biasa.
         viewport-fit=cover supaya konten aman di area notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f9fafb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#101216"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>Materi Pembelajaran</title>
    <script>
      // Sama seperti index.html: tema dipakai sebelum React memasang halaman
      // supaya tidak ada kedipan warna.
      (function () {
        var stored = localStorage.getItem("u-lar-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#101216" : "#f9fafb";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/materi.tsx"></script>
  </body>
</html>
